name: recipe_app
description: Recipe App - Flutter version converted from iOS SwiftUI app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  provider: ^6.1.2
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.0
  path: ^1.8.3

dependency_overrides:
  shared_preferences_android: ^2.4.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
